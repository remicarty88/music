<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c10">
<title>Тон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Иконки: Lucide (lucide.dev, лицензия ISC) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-dislike" viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</svg>

<header id="top">
  <button id="back" class="ib" aria-label="Назад" hidden><svg class="ic"><use href="#i-back"/></svg></button>
  <a class="logo" href="#/">Тон<i class="dot"></i></a>
  <div id="who"></div>
</header>

<main id="view"></main>

<!-- Мини-плеер -->
<div id="mini" hidden>
  <div id="miniOpen" class="mini-open" role="button" tabindex="0" aria-label="Открыть плеер">
    <div id="miniNp" class="mini-np"></div>
  </div>
  <button id="miniPlay" class="ib" aria-label="Играть или пауза"><svg class="ic fill"><use href="#i-play"/></svg></button>
  <div class="mini-bar"><i id="miniBar"></i></div>
</div>

<!-- Нижняя навигация -->
<nav id="tabs" aria-label="Разделы">
  <div class="tabs-in">
    <a href="#/wave" id="tab-wave"><svg class="ic"><use href="#i-wave"/></svg><span>Волна</span></a>
    <a href="#/search" id="tab-search"><svg class="ic"><use href="#i-search"/></svg><span>Поиск</span></a>
    <a href="#/" id="tab-my"><svg class="ic"><use href="#i-library"/></svg><span>Моё</span></a>
  </div>
</nav>

<!-- Полноэкранный плеер -->
<section id="sheet" aria-label="Плеер" aria-hidden="true">
  <div id="sheetBg" class="sheet-bg"></div>
  <div class="sheet-in">
    <div class="sheet-top">
      <button id="sheetClose" class="ib" aria-label="Свернуть"><svg class="ic"><use href="#i-down"/></svg></button>
      <span id="sheetKind">Сейчас играет</span>
      <i></i>
    </div>
    <div class="s-art"><img id="sCover" alt=""></div>
    <div id="sMeta" class="s-meta"></div>
    <div class="s-seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
      <div class="s-times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="s-ctrl">
      <button class="ib" id="shuffle" aria-label="Вперемешку"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button class="ib lg" id="prev" aria-label="Предыдущий"><svg class="ic fill"><use href="#i-prev"/></svg></button>
      <button class="play" id="play" aria-label="Играть или пауза"><svg class="ic fill"><use href="#i-play"/></svg></button>
      <button class="ib lg" id="next" aria-label="Следующий"><svg class="ic fill"><use href="#i-next"/></svg></button>
      <button class="ib" id="repeat" aria-label="Повтор"><svg class="ic"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="s-quality" role="group" aria-label="Качество звука">
      <button data-q="economy">Эконом</button>
      <button data-q="standard">Стандарт</button>
      <button data-q="high">Высокое</button>
    </div>
    <div id="qinfo" class="qinfo"></div>
  </div>
</section>

<div id="toast" role="status"></div>
<audio id="audio" preload="auto" playsinline></audio>

<script src="/app.js"></script>
</body>
</html>
